apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-prod
namePrefix: prod-
resources: [../../base]
components:
- ../../components/metrics
- ../../components/ingress
configMapGenerator:
- name: api-config
  behavior: merge
  literals: [version=v1-prod]
patches:
- path: patch-replicas.yaml
