image:
  repository: demo-api
  tag: v1
  pullPolicy: IfNotPresent
replicas: 1
nameOverride: ""
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: false
  className: nginx
  hosts:
  - host: api.example
    paths:
    - path: /api
      pathType: Prefix
hpa:
  enabled: false
  min: 1
  max: 5
  cpuTarget: 60
env:
  APP_VERSION: v1
  RUNTIME: k8s
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits:   { cpu: 200m, memory: 128Mi }
