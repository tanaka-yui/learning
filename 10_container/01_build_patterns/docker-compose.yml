services:
  app-dev:
    build: { context: ./a-same-image, target: dev }
    ports: ["8080:8080"]
    profiles: ["dev"]
  app-prod:
    build: { context: ./a-same-image, target: prod }
    ports: ["8081:8080"]
    profiles: ["prod"]
  runtime-go:
    build: { context: ./b-runtime-only, target: distroless }
    ports: ["8082:8080"]
    profiles: ["runtime"]
  runtime-node:
    build:
      context: ./b-runtime-only
      dockerfile: Dockerfile.node
    profiles: ["runtime"]
