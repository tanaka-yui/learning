apiVersion: apps/v1
kind: Deployment
metadata:
  name: karpenter-load
  namespace: karpenter-demo
spec:
  replicas: 20
  selector:
    matchLabels:
      app: load
  template:
    metadata:
      labels:
        app: load
    spec:
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10
        resources:
          requests:
            cpu: 500m
            memory: 64Mi
