# RBAC モデル定義
# PEP(ミドルウェア) が (sub, obj, act) を送り、
# PDP(エンフォーサ) がこのモデルと policy.csv で判定する。

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act
